# Veckovis hämtning av budgethandlingar för 2027.
# Söker med Brave Search API, hämtar dokumenten, letar efter reformorden och
# tar fram en lista med 3–10 kommuner att granska (arbete/veckolista/).
#
# Starta manuellt: Actions → "Hämta budgethandlingar" → Run workflow.
# Den kan också startas genom att ändra arbete/hamtning/kor.json och committa.

name: Hämta budgethandlingar

on:
  schedule:
    - cron: "17 4 * * 1" # måndagar 05.17 svensk vintertid
  workflow_dispatch:
    inputs:
      antal:
        description: "Antal kommuner i listan (tomt = 3–10 efter poäng)"
        required: false
        default: ""
      max_sok:
        description: "Högsta antal sökningar mot Brave"
        required: false
        default: "250"
      portaler:
        description: "Sök också igenom mötesportalerna med webbläsare (tar längre tid)"
        type: boolean
        default: true
      budgetsok:
        description: "Riktad sökning efter budget 2027 för kommuner med status 5"
        type: boolean
        default: true
      omanalysera:
        description: "Sök och hämta inget nytt, analysera om redan hämtade PDF:er"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["arbete/hamtning/kor.json"]

permissions:
  contents: write
  issues: write

concurrency:
  group: hamta
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Installera pdftotext och OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ocrmypdf tesseract-ocr-swe

      - name: Återställ hämtade PDF:er
        uses: actions/cache@v4
        with:
          path: |
            .cache/pdf
            .cache/sokresultat.json
          key: pdf-${{ github.run_id }}
          restore-keys: pdf-

      - name: Inställningar
        id: inst
        run: |
          antal="${{ github.event.inputs.antal }}"
          max_sok="${{ github.event.inputs.max_sok }}"
          omanalysera="${{ github.event.inputs.omanalysera }}"
          portaler="${{ github.event.inputs.portaler }}"
          budgetsok="${{ github.event.inputs.budgetsok }}"
          budget_max_sok=170
          if [ "${{ github.event_name }}" = "schedule" ]; then portaler=true; budgetsok=true; fi
          if [ "${{ github.event_name }}" = "push" ] && [ -f arbete/hamtning/kor.json ]; then
            antal=$(jq -r '.antal // empty' arbete/hamtning/kor.json)
            max_sok=$(jq -r '.max_sok // empty' arbete/hamtning/kor.json)
            omanalysera=$(jq -r '.omanalysera // false' arbete/hamtning/kor.json)
            portaler=$(jq -r '.portaler // false' arbete/hamtning/kor.json)
            budgetsok=$(jq -r '.budgetsok // false' arbete/hamtning/kor.json)
            bara_kort=$(jq -r '.bara_kort // false' arbete/hamtning/kor.json)
            budget_max_sok=$(jq -r '.budget_max_sok // 170' arbete/hamtning/kor.json)
          fi
          echo "antal=${antal}" >> "$GITHUB_OUTPUT"
          echo "max_sok=${max_sok:-250}" >> "$GITHUB_OUTPUT"
          echo "omanalysera=${omanalysera:-false}" >> "$GITHUB_OUTPUT"
          echo "portaler=${portaler:-false}" >> "$GITHUB_OUTPUT"
          echo "budgetsok=${budgetsok:-false}" >> "$GITHUB_OUTPUT"
          echo "bara_kort=${bara_kort:-false}" >> "$GITHUB_OUTPUT"
          echo "budget_max_sok=${budget_max_sok}" >> "$GITHUB_OUTPUT"
          echo "Antal: ${antal:-3–10}, högst ${max_sok:-250} sökningar"

      - name: 1. Sök
        if: steps.inst.outputs.bara_kort != 'true' && (steps.inst.outputs.omanalysera != 'true' && steps.inst.outputs.max_sok != '0')
        env:
          # Nyckeln läses bara som miljövariabel och skrivs aldrig ut.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MAX_SOK: ${{ steps.inst.outputs.max_sok }}
        run: python3 verktyg/hamta/sok.py

      - name: Installera webbläsaren
        if: steps.inst.outputs.bara_kort != 'true' && ((steps.inst.outputs.portaler == 'true' || steps.inst.outputs.budgetsok == 'true') && steps.inst.outputs.omanalysera != 'true')
        run: pip install -q playwright && python -m playwright install --with-deps chromium

      - name: 1b. Sök i mötesportalerna
        if: steps.inst.outputs.bara_kort != 'true' && (steps.inst.outputs.portaler == 'true' && steps.inst.outputs.omanalysera != 'true')
        run: python3 verktyg/hamta/portaler.py

      - name: 1c. Riktad sökning efter budget 2027
        if: steps.inst.outputs.bara_kort != 'true' && (steps.inst.outputs.budgetsok == 'true' && steps.inst.outputs.omanalysera != 'true')
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BUDGET_MAX_SOK: ${{ steps.inst.outputs.budget_max_sok }}
        run: python3 verktyg/hamta/budgetsok.py

      - name: 1d. Mötessidor, KF/KS-datum och aktuella kallelser
        if: steps.inst.outputs.bara_kort != 'true' && (steps.inst.outputs.portaler == 'true' && steps.inst.outputs.omanalysera != 'true')
        continue-on-error: true
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python3 verktyg/hamta/motessidor.py --max-sok 120

      - name: 2. Hämta dokument
        if: steps.inst.outputs.bara_kort != 'true' && (steps.inst.outputs.omanalysera != 'true')
        run: python3 verktyg/hamta/hamta_dokument.py --max-dokument 900 --max-minuter 130

      - name: 2. Analysera om hämtade PDF:er
        if: steps.inst.outputs.bara_kort != 'true' && (steps.inst.outputs.omanalysera == 'true')
        run: python3 verktyg/hamta/hamta_dokument.py --omanalysera

      - name: 3. Välj kommuner att granska
        if: steps.inst.outputs.bara_kort != 'true'
        env:
          ANTAL: ${{ steps.inst.outputs.antal }}
        run: python3 verktyg/hamta/prioritera.py

      - name: 4. Granskningskort för kommuner utan status
        run: python3 verktyg/hamta/forgranska.py

      - name: Spara resultatet i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arbete/hamtning arbete/veckolista arbete/granskning/kort
          git commit -q -m "Veckohämtning $(date +%F): lista att granska" || true
          git pull -q --rebase origin main
          git push -q origin HEAD:main || exit 1
          exit 0

      - name: Skapa ärende med veckans lista
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="arbete/veckolista/$(date +%F).md"
          gh issue create --title "$(head -1 "$f" | sed 's/^# //')" --body-file "$f"
